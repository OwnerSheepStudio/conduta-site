</defs>
<g filter="url(#carvao)" fill="url(#hachura)" stroke="none" opacity=".95"><circle cx="27" cy="27" r="11"/></g>
<g filter="url(#lapis)" fill="none" stroke="#222927" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="27" cy="27" r="14"/><path d="M37 37 L52 52" stroke-width="5"/><path d="M50 50 L54 54" stroke-width="6.5"/><path d="M20 22 H33 M20 27 H30 M20 32 H31" stroke-width="1.6"/></g>
<g fill="none" stroke="#E8E6DC" stroke-width=".8" stroke-linecap="round" opacity=".55"><path d="M18 21 C19 17 22 15 25 14.5"/></g>
</svg>
